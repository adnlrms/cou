<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Certificate of Utilization Registry</title>
<meta name="description" content="Official registry of learning resources issued a Certificate of Utilization. Search by title, developer, subject or CU code, apply for a certificate, or track an application.">
<meta name="theme-color" content="#0B2545">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src https://script.google.com https://script.googleusercontent.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="same-origin">
<style>/* inside another site's frame (clickjacking) or a file-preview pane: show only a link to open the registry in its own tab */
html.framed body>*:not(.framed-note){display:none!important}
.framed-note{display:none}
html.framed .framed-note{display:block;font-family:system-ui,sans-serif;max-width:460px;margin:60px auto;padding:24px;border:1px solid #C5CFDC;border-top:3px solid #B08A2E;border-radius:6px;color:#13233A;background:#fff}
html.framed .framed-note a{display:inline-block;margin-top:12px;background:#0E2A47;color:#fff;padding:10px 16px;border-radius:4px;text-decoration:none;font-weight:600}</style>
<script>if (window.top !== window.self) document.documentElement.classList.add('framed');</script>
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Libre+Caslon+Display&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Libre+Caslon+Display&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: "Registry ledger" — a left-aligned search desk beside a CU-number key,
   results ruled like a ledger, records filed like catalog cards, statuses as dated rubber stamps. */
:root{
  --brand:#0E2A47;      /* seal navy: header, primary buttons */
  --brand-2:#1D3F66;
  --foil:#B08A2E;       /* gold foil: rules and accents */
  --foil-soft:#E9D59A;
  --foil-ink:#7A5E14;   /* gold that is readable as text */
  --page:#F4F6F9;       /* page ground, cool white */
  --sheet:#FFFFFF;      /* filed paper */
  --sheet-2:#F8F9FB;
  --rule:#DCE2EA;       /* ledger hairline */
  --rule-2:#C5CFDC;
  --text:#13233A;
  --text-2:#3D4F68;
  --muted:#66768D;
  --heading:#0E2A47;
  --link:#1D4F86;
  --ok:#1E6B45;   --ok-bg:#E5F2EA;  --ok-line:#B9DCC7;
  --warn:#8A5A00; --warn-bg:#FFF4D8; --warn-line:#EED9A0;
  --bad:#A3272B;  --bad-bg:#FBE9E9; --bad-line:#EFC3C3;
  --info:#1F4F8F; --info-bg:#E8EFFA;
  --violet:#4B3A9A; --violet-bg:#EEEAFB;
  --teal:#1D6B6B; --teal-bg:#E3F2F2;
  --sk:#E7EBF1; --sk-2:#F3F5F8;
  --display:'Libre Caslon Display','Libre Caslon Text',Georgia,'Times New Roman',serif;
  --serif:'Libre Caslon Text',Georgia,'Times New Roman',serif;
  --sans:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  --r:6px; --r-sm:4px;
  /* names kept for older inline styles */
  --navy:var(--heading); --gold:var(--foil); --line:var(--rule); --bg:var(--page);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --brand:#0E2A47; --brand-2:#1F4370; --foil:#C9A54A; --foil-soft:#5C4A1C; --foil-ink:#E2C26F;
  --page:#0B1524; --sheet:#111F33; --sheet-2:#15263E; --rule:#22365A; --rule-2:#2E4570;
  --text:#E6ECF4; --text-2:#B6C3D5; --muted:#8696AD; --heading:#EEF2F8; --link:#8FB7EA;
  --ok:#7BD0A0; --ok-bg:#12301F; --ok-line:#285C3F; --warn:#F0C567; --warn-bg:#33270B; --warn-line:#5E4A18;
  --bad:#F19A9C; --bad-bg:#3A1517; --bad-line:#6A2A2E; --info:#93B9F0; --info-bg:#132A4A;
  --violet:#B9ADF2; --violet-bg:#251E47; --teal:#86D2D2; --teal-bg:#103232; --sk:#1A2C47; --sk-2:#22385A;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --brand:#0E2A47; --brand-2:#1F4370; --foil:#C9A54A; --foil-soft:#5C4A1C; --foil-ink:#E2C26F;
  --page:#0B1524; --sheet:#111F33; --sheet-2:#15263E; --rule:#22365A; --rule-2:#2E4570;
  --text:#E6ECF4; --text-2:#B6C3D5; --muted:#8696AD; --heading:#EEF2F8; --link:#8FB7EA;
  --ok:#7BD0A0; --ok-bg:#12301F; --ok-line:#285C3F; --warn:#F0C567; --warn-bg:#33270B; --warn-line:#5E4A18;
  --bad:#F19A9C; --bad-bg:#3A1517; --bad-line:#6A2A2E; --info:#93B9F0; --info-bg:#132A4A;
  --violet:#B9ADF2; --violet-bg:#251E47; --teal:#86D2D2; --teal-bg:#103232; --sk:#1A2C47; --sk-2:#22385A;
  color-scheme:dark;
}

/* ---------- base ---------- */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;padding:0}
body{font-family:var(--sans);color:var(--text);background:var(--page);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--link)} a:hover{color:var(--heading)}
img,svg{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);color:var(--heading);line-height:1.2;margin:0;font-weight:700;text-wrap:balance}
h1{font-family:var(--display);font-weight:400;letter-spacing:-.005em}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.small{font-size:13px}
.hide{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
:focus-visible{outline:2px solid var(--foil);outline-offset:2px}

.boot{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted)}
.spinner{width:30px;height:30px;border:3px solid var(--rule);border-top-color:var(--foil);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- header: navy band with a gold double rule, like a certificate border ---------- */
.topbar{background:var(--brand);color:#fff;border-bottom:4px double var(--foil);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.topbar-inner{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:8px max(20px,env(safe-area-inset-right)) 8px max(20px,env(safe-area-inset-left));min-height:62px}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer;text-decoration:none;color:#fff;min-width:0}
.brand:hover{color:#fff}
.seal{width:42px;height:42px;border-radius:50%;border:2px solid var(--foil);display:flex;align-items:center;justify-content:center;flex:none;
  font-family:var(--serif);font-weight:700;color:#E9D59A;font-size:14px;letter-spacing:.04em;box-shadow:inset 0 0 0 3px var(--brand),inset 0 0 0 4px rgba(201,165,74,.55)}
.seal.has-img{background:#fff;box-shadow:none;overflow:hidden}
.seal img,.seal.has-img img{width:100%;height:100%;object-fit:contain;border-radius:50%}
.brand-text{min-width:0}
.brand-kicker{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#E9D59A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-name{font-family:var(--serif);font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{margin-left:auto;display:flex;align-items:center;gap:2px}
.nav a,.nav button.navlink{color:#D5DEEC;text-decoration:none;padding:8px 11px;border-radius:var(--r-sm);font-size:14px;font-weight:500;background:none;border:0;cursor:pointer;white-space:nowrap}
.nav a:hover,.nav button.navlink:hover{background:rgba(255,255,255,.08);color:#fff}
.nav a.active{color:#fff;box-shadow:inset 0 -2px 0 var(--foil)}
.nav a.btn-gold{margin-left:8px;background:var(--foil);color:#0E2A47;font-weight:600;box-shadow:none}
.nav a.btn-gold:hover{background:#C9A54A;color:#0E2A47}
.menu-btn{display:none;margin-left:auto;background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:var(--r-sm);padding:6px 10px;cursor:pointer}
.userchip{display:flex;align-items:center;gap:6px;padding:2px 4px 2px 12px;border-left:1px solid rgba(255,255,255,.18);margin-left:6px}
.userchip .who{font-size:12px;line-height:1.25;text-align:right}
.userchip .who b{display:block;color:#fff;font-weight:600;font-size:13px;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.userchip .who span{color:#E9D59A}
@media (max-width:1320px){
  .menu-btn{display:block}
  .nav{display:none;position:absolute;top:100%;left:0;right:0;background:var(--brand-2);flex-direction:column;align-items:stretch;padding:8px max(14px,env(safe-area-inset-right)) 14px max(14px,env(safe-area-inset-left));border-bottom:4px double var(--foil)}
  .nav.open{display:flex}
  .nav a,.nav button.navlink{padding:12px;text-align:left}
  .nav a.btn-gold{margin:8px 0 0;text-align:center;justify-content:center}
  .userchip{border-left:0;border-top:1px solid rgba(255,255,255,.18);margin:6px 0 0;padding:12px 0 0;justify-content:space-between;flex-wrap:wrap}
  .userchip .who{text-align:left;flex:1 1 100%}
}
.demo-ribbon{background:var(--foil);color:#0E2A47;text-align:center;font-size:12.5px;font-weight:600;padding:6px 12px}

/* ---------- page scaffolding ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:28px max(20px,env(safe-area-inset-right)) 64px max(20px,env(safe-area-inset-left))}
.wrap.narrow{max-width:780px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--rule)}
.page-head h1{font-size:32px}
.page-head p{margin:6px 0 0;color:var(--muted)}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:12px}
.crumbs a{color:var(--muted);text-decoration:none}
.crumbs a:hover{color:var(--heading);text-decoration:underline}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.span2{grid-column:1 / -1}
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
.card,.split>*,.grid>*{min-width:0}
@media (max-width:960px){.split{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr}}
@media (max-width:600px){.g2,.g4{grid-template-columns:1fr}.wrap{padding:18px max(14px,env(safe-area-inset-right)) 52px max(14px,env(safe-area-inset-left))}.page-head h1{font-size:26px}}
@media (min-width:1600px){.wrap,.topbar-inner,footer.site .inner{max-width:1360px}body{font-size:16px}}

/* paper: hairline border, no drop shadow — only dialogs float */
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r)}
.card-pad{padding:22px}
.card h2{font-size:20px;margin-bottom:12px}
.card h3{font-size:16px;margin-bottom:8px}
.section-label{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--foil-ink);font-weight:700;margin:0 0 10px}
@media (max-width:600px){.card-pad{padding:18px 16px}.page-head .input{max-width:none!important;width:100%}}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r-sm);padding:10px 16px;font-weight:600;font-size:14px;border:1px solid transparent;cursor:pointer;text-decoration:none;line-height:1.2;transition:background .15s,border-color .15s,color .15s}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn-primary:hover:not(:disabled){background:var(--brand-2);color:#fff}
.btn-gold{background:var(--foil);color:#0E2A47}
.btn-gold:hover:not(:disabled){background:#C9A54A;color:#0E2A47}
.btn-ghost{background:var(--sheet);color:var(--heading);border-color:var(--rule-2)}
.btn-ghost:hover:not(:disabled){border-color:var(--heading)}
.btn-danger{background:var(--sheet);color:var(--bad);border-color:var(--bad-line)}
.btn-danger:hover:not(:disabled){background:var(--bad-bg)}
.btn-sm{padding:6px 10px;font-size:13px}
.btn-block{width:100%}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.linkbtn{background:none;border:0;padding:0;color:var(--link);cursor:pointer;text-decoration:underline;font-size:inherit}

/* ---------- forms ---------- */
.field{margin-bottom:16px}
.field label,.lbl{display:block;font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:6px}
.field .hint,.hint{font-size:12px;color:var(--muted);margin-top:5px}
.req{color:var(--bad)}
/* 16px text in fields stops phones from zooming in on tap */
.input,select.input,textarea.input{width:100%;padding:10px 12px;border:1px solid var(--rule-2);border-radius:var(--r-sm);background:var(--sheet);font-size:16px;outline:none;transition:border-color .15s,box-shadow .15s}
.input:focus{border-color:var(--foil);box-shadow:0 0 0 3px color-mix(in srgb,var(--foil) 25%,transparent)}
.input:disabled{background:var(--sheet-2);color:var(--muted)}
textarea.input{min-height:130px;resize:vertical;line-height:1.5}
.input-sm{padding:6px 8px;font-size:14px;width:auto;border:1px solid var(--rule-2);border-radius:var(--r-sm);background:var(--sheet)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.5}
.check input{margin-top:3px;width:18px;height:18px;accent-color:var(--brand);flex:none}
.err{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad-line);border-left-width:4px;padding:10px 14px;border-radius:var(--r-sm);font-size:14px;margin-bottom:14px}
.note{background:var(--info-bg);color:var(--info);border:1px solid color-mix(in srgb,var(--info) 25%,transparent);padding:10px 14px;border-radius:var(--r-sm);font-size:14px}
.code-input{display:flex;gap:8px}.code-input .input{flex:1;min-width:0;letter-spacing:.14em}
.code-show{font-family:var(--mono);font-size:24px;font-weight:600;color:var(--heading);letter-spacing:.14em;border:2px dashed var(--foil);border-radius:var(--r-sm);padding:14px;text-align:center;margin:8px 0 12px;word-break:break-all;background:var(--sheet-2)}
.help-list{padding-left:20px;color:var(--text-2);font-size:14px}.help-list li{margin-bottom:10px}

/* ---------- stepper (application form) ---------- */
.stepper{display:flex;margin:0 0 22px;overflow-x:auto;border-top:1px solid var(--rule)}
.step{flex:1;min-width:110px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);padding:12px 8px;border-top:3px solid transparent;margin-top:-1px}
.step .n{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--rule-2);font-weight:700;font-size:12px;flex:none;background:var(--sheet);font-family:var(--mono)}
.step.active{color:var(--heading);border-top-color:var(--foil);font-weight:600}
.step.active .n{border-color:var(--brand);background:var(--brand);color:#fff}
.step.done{color:var(--text-2);border-top-color:var(--rule-2)}
.step.done .n{border-color:var(--brand-2);color:var(--heading)}
@media (max-width:600px){.step span.t{display:none}.step{min-width:0;justify-content:center}}

/* ---------- status tags (small, inked) ---------- */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:3px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;border:1px solid currentColor;background:transparent}
.b-Submitted{color:var(--info);background:var(--info-bg)}
.b-Screening,.b-Under{color:var(--violet);background:var(--violet-bg)}
.b-For{color:var(--warn);background:var(--warn-bg)}
.b-Recommended{color:var(--teal);background:var(--teal-bg)}
.b-Approved,.b-Active{color:var(--ok);background:var(--ok-bg)}
.b-Rejected,.b-Revoked{color:var(--bad);background:var(--bad-bg)}
.b-Withdrawn{color:var(--muted);background:var(--sheet-2)}

/* rubber stamp: status with the date it was stamped */
.stamp{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 14px 7px;border:3px double currentColor;border-radius:5px;
  font-family:var(--mono);font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;transform:rotate(-3deg);color:var(--info);
  background:transparent;line-height:1.1;mix-blend-mode:multiply;opacity:.92;white-space:nowrap}
.stamp small{font-size:10px;letter-spacing:.1em;font-weight:500;opacity:.85}
.stamp.ok{color:var(--ok)}.stamp.bad{color:var(--bad)}.stamp.warn{color:var(--warn)}.stamp.violet{color:var(--violet)}.stamp.teal{color:var(--teal)}.stamp.muted{color:var(--muted)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .stamp{mix-blend-mode:normal}}
:root[data-theme="dark"] .stamp{mix-blend-mode:normal}

/* ---------- tables (ledger) ---------- */
.table-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--foil-ink);font-weight:700;padding:10px 12px;border-bottom:2px solid var(--heading);white-space:nowrap;background:var(--sheet)}
.tbl td{padding:12px;border-bottom:1px solid var(--rule);vertical-align:top;overflow-wrap:anywhere}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--sheet-2)}
.tbl .t-title{font-weight:600;color:var(--heading)}
@media (max-width:700px){
  table.tbl.stack thead{display:none}
  table.tbl.stack tr{display:block;border-bottom:1px solid var(--rule);padding:10px 4px}
  table.tbl.stack td{display:flex;justify-content:space-between;gap:12px;border:0;padding:4px 8px}
  table.tbl.stack td::before{content:attr(data-l);font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);flex:none}
  table.tbl.stack td.t-title{display:block}
  table.tbl.stack td.t-title::before{display:none}
}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule-2);margin-bottom:16px;overflow-x:auto}
.tab{background:none;border:0;padding:10px 14px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.active{color:var(--heading);border-bottom-color:var(--foil);font-weight:600}
.tab .cnt{display:inline-block;min-width:20px;padding:0 6px;border-radius:3px;background:var(--sheet-2);border:1px solid var(--rule);font-size:11px;margin-left:6px;text-align:center;font-family:var(--mono)}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty h3{color:var(--text-2);font-size:19px;margin-bottom:6px}

/* ---------- analytics ---------- */
.stat{padding:16px 18px;border-top:3px solid var(--rule-2)}
.stat.accent{border-top-color:var(--foil)}
.stat .v{font-family:var(--serif);font-size:32px;font-weight:700;color:var(--heading);line-height:1.1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-top:6px}
.bars .bar{display:grid;grid-template-columns:minmax(90px,200px) 1fr 40px;gap:10px;align-items:center;margin:8px 0;font-size:13px}
.bars .track{height:10px;background:var(--sheet-2);border:1px solid var(--rule);border-radius:2px;overflow:hidden}
.bars .fill{height:100%;background:var(--brand-2)}
.bars .lbl2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-2)}
.bars .num{text-align:right;font-weight:600;color:var(--heading);font-variant-numeric:tabular-nums}
.cols{display:flex;align-items:flex-end;gap:3px;height:150px;padding-top:10px;border-bottom:1px solid var(--rule-2)}
.cols .c{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:10px;color:var(--muted)}
.cols .c .b{width:100%;max-width:34px;background:var(--foil);min-height:2px}
.cols .c .n{font-weight:600;color:var(--heading);font-size:11px;margin-bottom:3px}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.sk-line{animation:none}}

/* ---------- print ---------- */
@media print{
  .topbar,footer.site,.demo-ribbon,.btn,.menu-btn,.crumbs,.searchbar,.filters,#toast,#modal-root,aside .side-card:not(:first-child){display:none!important}
  body{background:#fff;color:#000}.card,.record{border-color:#bbb}
  .split{grid-template-columns:1fr}.wrap{padding:0;max-width:none}
}

/* Direct registration */
.reg-head{display:flex;gap:20px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--rule);margin-bottom:18px}
.next-no{border:1px dashed var(--foil);border-radius:var(--r-sm);padding:12px 16px;background:var(--page);min-width:0;max-width:100%}
.reg-sec{border:0;border-top:1px solid var(--rule);margin:22px 0 0;padding:16px 0 0;min-width:0}
.reg-sec legend{font-family:var(--serif);font-size:18px;color:var(--heading);padding:0 10px 0 0}
.seg-toggle{display:inline-flex;border:1px solid var(--rule-2);border-radius:var(--r-sm);overflow:hidden;margin-bottom:14px;flex-wrap:wrap}
.seg-toggle label{display:flex;align-items:center;gap:8px;padding:9px 14px;font-size:14px;cursor:pointer;min-height:44px}
.seg-toggle label:has(input:checked){background:var(--brand);color:#fff}
.seg-toggle input{accent-color:var(--foil)}
.dropzone{display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;text-align:center;border:2px dashed var(--rule-2);border-radius:var(--r-sm);padding:26px 16px;cursor:pointer;background:var(--page);word-break:break-word}
.dropzone:hover,.dropzone:focus-within{border-color:var(--foil)}
.override-card{border-top:3px solid var(--foil)}

.store-row{border-top:1px solid var(--rule);padding:18px 0 4px;margin-top:16px}
.store-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.store-head h3{margin:0;font-family:var(--serif);font-size:18px;color:var(--heading)}
.store-now{font-size:14px;word-break:break-word}

.more-row{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:16px}
.more-note{text-align:center;margin:16px auto 0;max-width:60ch}
.upl{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:14px;flex-wrap:wrap}
.upl .bar{flex:1;min-width:120px;height:6px;border-radius:3px;background:var(--rule);overflow:hidden;position:relative}
.upl .bar i{position:absolute;inset:0 auto 0 0;width:40%;background:var(--foil);border-radius:3px;animation:upl 1.1s ease-in-out infinite}
.upl.done .bar i{width:100%;animation:none;background:var(--ok)}
.upl.fail{color:var(--bad)}
@keyframes upl{0%{left:-40%}100%{left:100%}}
@media (prefers-reduced-motion:reduce){.upl .bar i{animation:none;width:100%;opacity:.5}}

      if (i === -1) { var parts = s.split(/\s+/); return { last: parts.pop(), first: parts.join(' ') }; }

    });
    if (!list.length && display) list = String(display).split(',').map(function (s) { var p = s.trim().split(/\s+/); return { last: p.pop(), first: p.join(' ') }; });

  }

        out.innerHTML = /\/folders\//.test(v) ? '<span style="color:var(--ok)">✓ Google Drive folder link</span>' : '<span style="color:var(--warn)">This looks like a single file. A folder holding all three requirements is preferred.</span>';
      };
      rl.oninput = check; check();
    }
    var sub = $('#submit');
    if (sub) sub.onclick = function () {
      save();
      if (!F.declaration) { $('#msg').innerHTML = errBox('Please accept the Declaration of Originality.'); return; }
      if (!F.consent) { $('#msg').innerHTML = errBox('Please agree to the Privacy Notice.'); return; }
      busy(sub, true, 'Submitting…');
      var payload = {};
      Object.keys(F).forEach(function (k) { if (['step', 'revise'].indexOf(k) === -1) payload[k] = F[k]; });
      payload.developers = F.developers.filter(function (x) { return x.first && x.last; });
      payload.website = $('#website').value;
      if (rev) {
        delete payload.applicantEmail; // the email on file is kept
        api('resubmitApplication', F.revise.id, F.revise.key, payload).then(function () {
          var t = { id: F.revise.id, key: F.revise.key }; S.form = null;
          toast('Resubmitted. The LRMS team has been notified.'); S.track = t; go('track', {});
        }).catch(function (e) { busy(sub, false); $('#msg').innerHTML = errBox(e); window.scrollTo(0, 0); });
      } else {
        api('submitApplication', payload).then(function (r) {
          store.set(DRAFT_KEY, null); S.form = null; S.lastSubmit = r; S.track = { id: r.ApplicationID, key: r.trackingKey };
          go('submitted', {});
        }).catch(function (e) { busy(sub, false); $('#msg').innerHTML = errBox(e); window.scrollTo(0, 0); });
      }
    };
  }

      return '<div class="n"><div class="h">' + esc(m[1]) + ' · <b>' + esc(m[2]) + '</b> · ' + esc(m[3]) + '</div>' + esc(m[4]).replace(/ ⏎ /g, '<br>') + '</div>';
    }).join('') + '</div>';
  }

  // ------------------------------------------------------------------
  // STAFF: queue
  // ------------------------------------------------------------------
  var QUEUE_TABS = [
    ['action', 'Needs action', ['Submitted', 'Screening', 'Under Content Review']],
    ['final', 'Final approval', ['Recommended for Approval']],
    ['revision', 'With applicant', ['For Revision']],
    ['approved', 'Approved', ['Approved']],
    ['closed', 'Rejected / withdrawn', ['Rejected', 'Withdrawn']],
    ['all', 'All', null]
  ];
  function vQueue(main, alive) {
    var tab = S.params.tab || 'action';
    main.innerHTML = '<div class="wrap"><div class="page-head"><div><h1>Review Queue</h1><p>' + (isAdmin() ? 'All Certificate of Utilization applications.' : 'Applications assigned to you and unassigned applications you can claim.') + '</p></div>' +
      '<label class="sr-only" for="qs">Filter</label><input class="input" id="qs" placeholder="Filter by title, applicant, ID…" style="max-width:300px"></div><div id="body">' + skeleton('table') + '</div></div>';
    return api('reviewQueue', S.token).then(function (res) {
      if (!alive()) return;
      var base = res, cur = res, mine = false, searchId = 0, timer = null;
      function countFor(x) { return x[2] ? x[2].reduce(function (n, st) { return n + (base.counts[st] || 0); }, 0) : base.total; }
      function draw() {
        var rows = cur.rows;
        var t = QUEUE_TABS.filter(function (x) { return x[0] === tab; })[0] || QUEUE_TABS[0];
        var list = rows.filter(function (r) { return (!t[2] || t[2].indexOf(r.Status) !== -1) && (!mine || r.Mine); });
        if (['approved', 'closed', 'all'].indexOf(tab) !== -1) list = list.slice().reverse();
        var limited = !cur.searched && (tab === 'approved' || tab === 'closed' || tab === 'all') && countFor(t) > list.length;
        $('#body').innerHTML = '<div class="tabs">' + QUEUE_TABS.map(function (x) {
          return '<button class="tab ' + (x[0] === tab ? 'active' : '') + '" data-tab="' + x[0] + '">' + x[1] + '<span class="cnt">' + countFor(x) + '</span></button>';
        }).join('') + '</div>' +
          (cur.searched ? '<p class="small muted" style="margin:-4px 0 12px">Search results across all applications' + (rows.length >= 100 ? ' (first 100 — type more words to narrow down)' : '') + '.</p>' : '') +
          (limited ? '<p class="small muted" style="margin:-4px 0 12px">Showing the ' + (base.pageSize || 20) + ' most recent finished applications. Type in the filter box to search all of them.</p>' : '') +
          (!isAdmin() ? '<label class="check small" style="margin-bottom:12px"><input type="checkbox" id="mine" ' + (mine ? 'checked' : '') + '><span>Only show applications assigned to me</span></label>' : '') +
          (list.length ? '<div class="card table-wrap"><table class="tbl stack"><thead><tr><th>ID</th><th>Resource</th><th>Subject / Grade</th><th>Status</th><th>Reviewer</th><th>Waiting</th></tr></thead><tbody>' +
            list.map(function (r) {
              var wait = ageDays(r.DateUpdated || r.DateSubmitted);
              return '<tr class="click" data-go="app" data-id="' + esc(r.ApplicationID) + '"><td data-l="ID" class="mono small">' + esc(r.ApplicationID) + (Number(r.RevisionCount) ? '<div class="muted">rev ' + esc(r.RevisionCount) + '</div>' : '') + '</td>' +
                '<td class="t-title">' + esc(r.ResourceTitle) + '<div class="muted small" style="font-weight:400">' + esc(r.Applicant) + ' · ' + esc(r.School) + '</div>' + (r.CU_Code ? '<div class="mono small" style="font-weight:500">' + esc(r.CU_Code) + '</div>' : '') + '</td>' +
                '<td data-l="Subject">' + esc(r.SubjectArea) + '<div class="muted small">' + esc(r.GradeLevel) + '</div></td><td data-l="Status">' + badge(r.Status) + '</td>' +
                '<td data-l="Reviewer">' + (r.ReviewerName ? esc(r.ReviewerName) : '<span class="muted">—</span>') + '</td>' +
                '<td data-l="Waiting">' + (['Approved', 'Rejected', 'Withdrawn'].indexOf(r.Status) !== -1 ? d(r.DateUpdated) : (wait === 0 ? 'Today' : wait + ' day' + (wait === 1 ? '' : 's'))) + '</td></tr>';
            }).join('') + '</tbody></table></div>'
            : '<div class="card empty"><h3>Nothing here</h3><p>No applications match this view.</p></div>');
        $$('[data-tab]').forEach(function (b) { b.onclick = function () { tab = b.dataset.tab; S.params.tab = tab; draw(); }; });
        var m = $('#mine'); if (m) m.onchange = function () { mine = m.checked; draw(); };
      }
      $('#qs').oninput = function () { // searched on the server, so finished applications beyond the latest 20 are found too
        clearTimeout(timer);
        var q = $('#qs').value.trim(), my = ++searchId;
        if (!q) { cur = base; draw(); return; }
        timer = setTimeout(function () {
          api('reviewQueue', S.token, { q: q }).then(function (r) { if (alive() && my === searchId) { cur = r; draw(); } }).catch(function (e) { toast(e.message, true); });
        }, 350);
      };
      draw();
    });
  }

  // ------------------------------------------------------------------
  // STAFF: analytics

  function bars(obj, sortDesc) {
    var keys = Object.keys(obj).filter(function (k) { return obj[k] > 0; });
    if (sortDesc) keys.sort(function (a, b) { return obj[b] - obj[a]; });
    var max = Math.max.apply(null, keys.map(function (k) { return obj[k]; }).concat([1]));
    if (!keys.length) return '<p class="muted small">No data yet.</p>';
    return '<div class="bars">' + keys.map(function (k) { return '<div class="bar"><div class="lbl2" title="' + esc(k) + '">' + esc(k) + '</div><div class="track"><div class="fill" style="width:' + (100 * obj[k] / max) + '%"></div></div><div class="num">' + obj[k] + '</div></div>'; }).join('') + '</div>';
  }
  function vAnalytics(main, alive) {
    main.innerHTML = '<div class="wrap"><div class="page-head"><div><h1>Analytics</h1><p>Output of the Certificate of Utilization process.</p></div></div><div id="body">' + skeleton('table') + '</div></div>';
    return api('getAnalytics', S.token).then(function (a) {
      if (!alive()) return;
      var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      var mmax = Math.max.apply(null, Object.keys(a.perMonth).map(function (k) { return a.perMonth[k]; }).concat([1]));
      var stat = function (v, k, accent) { return '<div class="card stat ' + (accent ? 'accent' : '') + '"><div class="v">' + v + '</div><div class="k">' + k + '</div></div>'; };
      $('#body').innerHTML =
        '<div class="grid g4" style="margin-bottom:16px">' + stat(a.issuedThisYear, 'Certificates issued in ' + a.thisYear, true) + stat(a.pending, 'Pending applications') +
        stat(a.avgReviewDays === null ? '—' : a.avgReviewDays + '<span style="font-size:16px"> days</span>', 'Average review time') + stat(a.approvalRate === null ? '—' : a.approvalRate + '%', 'Approval rate') + '</div>' +
        '<div class="grid g4" style="margin-bottom:16px">' + stat(a.totalCertificates, 'Total CU codes issued') + stat(a.activeCertificates, 'Active certificates') +
        stat(a.awaitingFinal, 'Awaiting final approval') + stat(a.forRevision, 'With applicant for revision') + '</div>' +
        '<div class="grid g2"><div class="card card-pad"><h2>Certificates issued per month, ' + a.thisYear + '</h2><div class="cols">' +
        Object.keys(a.perMonth).sort().map(function (k, i) { var v = a.perMonth[k]; return '<div class="c"><div class="n">' + (v || '') + '</div><div class="b" style="height:' + (100 * v / mmax) + '%"></div><div>' + months[i] + '</div></div>'; }).join('') + '</div></div>' +
        '<div class="card card-pad"><h2>Certificates issued per year</h2>' + bars(a.perYear) + '</div>' +
        '<div class="card card-pad"><h2>Active certificates by subject area</h2>' + bars(a.bySubject, true) + '</div>' +
        '<div class="card card-pad"><h2>Applications by status</h2>' + bars(a.byStatus) + '<p class="small muted">' + a.totalApplications + ' applications in total.</p></div></div>';
    });

  // ---- Direct registration: material already quality assured → next CU number ----
  // The file goes up in the background as soon as it is chosen; registering only claims it.
  function uplHtml(R) {
    var u = R.up; if (!u) return '';
    if (u.state === 'uploading') return '<div class="upl" role="status"><span>Uploading ' + esc(R.file.name) + '…</span><div class="bar"><i></i></div></div>';
    if (u.state === 'done') return '<div class="upl done" role="status"><span>✓ Uploaded</span><div class="bar"><i></i></div><span class="muted small">' + (u.secs ? u.secs + ' s' : '') + '</span></div>';
    return '<div class="upl fail" role="alert">Upload failed: ' + esc(u.error) + ' — choose the file again.</div>';
  }
  function startUpload(file, R) {
    var t0 = Date.now(), up = { state: 'uploading' };
    R.up = up;
    var paint = function () { if (R.up === up) { var el = document.getElementById('r-upl'); if (el) el.innerHTML = uplHtml(R); } };
    up.p = new Promise(function (res, rej) {
      var rd = new FileReader();
      rd.onload = function () { res(String(rd.result).split(',')[1]); };
      rd.onerror = function () { rej(new Error('Could not read the file from this device')); };
      rd.readAsDataURL(file);
    }).then(function (data) {
      return api('uploadMaterial', S.token, { name: file.name, mimeType: file.type || 'application/octet-stream', data: data });
    }).then(function (r) { up.state = 'done'; up.id = r.uploadId; up.secs = Math.max(1, Math.round((Date.now() - t0) / 1000)); paint(); return r.uploadId; },
      function (e) { up.state = 'failed'; up.error = e.message || String(e); paint(); return null; });
  }

      '<div class="grid g2">' + sel('subjectArea', L.SubjectArea, 'Subject area', true) + sel('gradeLevel', L.GradeLevel, 'Grade level', true) + '</div>' +
      '<div class="grid g2">' + sel('language', L.Language, 'Language') + sel('license', L.License, 'Copyright / license') + '</div>' +
      inp('keywords', 'Keywords', false, 'maxlength="300"') +
      '<div class="field"><label for="r-abstract">Abstract</label><textarea class="input" id="r-abstract" data-r="abstract" style="min-height:90px" maxlength="3000">' + esc(R.abstract || '') + '</textarea></div></fieldset>' +
      '<fieldset class="reg-sec"><legend>Developers</legend><div id="r-devs">' + R.developers.map(function (dv, i) {
        return '<div class="dev-card" data-i="' + i + '"><div class="dev-head"><b>Developer ' + (i + 1) + '</b>' + (R.developers.length > 1 ? '<button type="button" class="linkbtn small" data-rrm="' + i + '">Remove</button>' : '') + '</div>' +
          '<div class="dev-grid"><input class="input" data-k="first" placeholder="First name" value="' + esc(dv.first) + '" aria-label="First name"><input class="input" data-k="mi" placeholder="M.I." maxlength="4" value="' + esc(dv.mi) + '" aria-label="Middle initial">' +
          '<input class="input" data-k="last" placeholder="Last name" value="' + esc(dv.last) + '" aria-label="Last name"><input class="input" data-k="position" placeholder="Position" value="' + esc(dv.position) + '" aria-label="Position"></div></div>';
      }).join('') + '</div><button type="button" class="btn btn-ghost btn-sm" id="r-add">+ Add developer</button>' +
      '<div class="grid g2" style="margin-top:14px">' + inp('school', 'School', true, 'maxlength="200"') + inp('district', 'District', false, 'maxlength="200"') + '</div></fieldset>' +
      '<fieldset class="reg-sec"><legend>Quality assurance already done</legend><div class="grid g2">' + sel('qaBy', L.QABody, 'Quality assured by', true) + inp('qaDate', 'Date cleared', false, 'type="date"') + '</div>' +
      inp('qaReference', 'Reference', false, 'maxlength="200" placeholder="e.g. QA Memo No. 45, s. 2026"', 'Memo, evaluation report or other proof. Shown to staff and printed in the audit log.') +
      '<div class="field"><label for="r-remarks">Remarks</label><input class="input" id="r-remarks" data-r="remarks" value="' + esc(R.remarks || '') + '" maxlength="1000"></div></fieldset>' +
      '<fieldset class="reg-sec"><legend>The material</legend><div class="seg-toggle" role="radiogroup" aria-label="How to attach the material">' +
      '<label><input type="radio" name="r-mode" value="upload" ' + (R.mode === 'upload' ? 'checked' : '') + '> Upload the file</label><label><input type="radio" name="r-mode" value="link" ' + (R.mode === 'link' ? 'checked' : '') + '> Paste a link</label></div>' +
      (R.mode === 'upload' ? '<label class="dropzone" id="r-dz"><input type="file" id="r-file" class="sr-only" accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.odt,.odp,.ods,.rtf,.txt,.epub,.png,.jpg,.jpeg,.gif,.webp,.mp4,.m4v,.mov,.webm,.mp3,.m4a,.wav,.ogg,.zip,.apk">' +
        '<b>' + (R.file ? esc(R.file.name) + ' · ' + (R.file.size / 1048576).toFixed(1) + ' MB' : 'Choose a file') + '</b><span class="hint">' + (R.file ? 'Click to choose a different file' : 'PDF, Word, PowerPoint, video, audio, EPUB, ZIP or APK · up to ' + esc(maxMb) + ' MB') + '</span></label>' +
        '<div id="r-upl">' + uplHtml(R) + '</div>' +
        '<p class="hint" style="margin:6px 0 0">Uploading starts as soon as you choose the file, so you can keep filling in the form. Saved privately in the registered-materials Drive folder.</p>' +
        '<label class="check" style="margin-top:10px"><input type="checkbox" id="r-publish" ' + (R.publishFile ? 'checked' : '') + '><span>Let the public download this file from the registry record</span></label>'
        : inp('fileLink', 'Link to the material', true, 'type="url" placeholder="https://drive.google.com/…"') +
          inp('resourceLink', 'Public link shown on the record', false, 'type="url" placeholder="Optional — leave blank to keep the material private"')) + '</fieldset>' +
      '<fieldset class="reg-sec"><legend>Send the certificate (optional)</legend><div class="grid g2">' + inp('contactName', 'Contact person', false, 'maxlength="120"') +
      inp('contactEmail', 'Email', false, 'type="email" maxlength="160"', 'The certificate PDF is emailed here.') + '</div>' +
      '<div class="field" style="max-width:420px"><label for="r-tpl">Certificate template</label>' + templateSelect(st.templates, '', 'r-tpl') + '</div></fieldset>' +
      '<div class="btn-row form-nav"><button class="btn btn-ghost" id="r-clear">Clear form</button><button class="btn btn-gold" id="r-go">Register & issue CU number</button></div></div>';

    api('nextCuPreview', S.token).then(function (r) { var el = $('#r-next'); if (el) el.innerHTML = codeParts(r.code); }).catch(function () { var el = $('#r-next'); if (el) el.textContent = '—'; });
    function save() {
      $$('[data-r]', body).forEach(function (el) { R[el.dataset.r] = el.value; });
      $$('#r-devs .dev-card', body).forEach(function (row) { var i = +row.dataset.i; $$('input', row).forEach(function (x) { R.developers[i][x.dataset.k] = x.value.trim(); }); });
      var pub = $('#r-publish', body); if (pub) R.publishFile = pub.checked;
      R.templateId = $('#r-tpl', body).value;
    }
    $$('input[name="r-mode"]', body).forEach(function (r) { r.onchange = function () { save(); R.mode = r.value; drawRegister(body, st); }; });
    $('#r-add', body).onclick = function () { save(); R.developers.push({ first: '', mi: '', last: '', position: '' }); drawRegister(body, st); };
    $$('[data-rrm]', body).forEach(function (b) { b.onclick = function () { save(); R.developers.splice(+b.dataset.rrm, 1); drawRegister(body, st); }; });
    $('#r-clear', body).onclick = function () { askConfirm('Clear the form?', 'Everything you entered here will be removed.', 'Clear', true).then(function (y) { if (y) { REG = regBlank(); drawRegister(body, st); } }); };
    var fi = $('#r-file', body);
    if (fi) fi.onchange = function () {
      var file = fi.files[0]; if (!file) return;
      if (file.size > Number(maxMb) * 1048576) { $('#r-msg').innerHTML = errBox('That file is ' + (file.size / 1048576).toFixed(1) + ' MB. The limit is ' + maxMb + ' MB — put it in Google Drive and paste the link instead.'); return; }
      if (!/\.(pdf|docx?|pptx?|xlsx?|odt|odp|ods|rtf|txt|epub|png|jpe?g|gif|webp|mp4|m4v|mov|webm|mp3|m4a|wav|ogg|zip|apk)$/i.test(file.name)) { $('#r-msg').innerHTML = errBox('That file type is not accepted. Use PDF, Word, PowerPoint, Excel, images, audio, video, EPUB, ZIP or APK.'); return; }
      save(); $('#r-msg').innerHTML = '';
      R.file = { name: file.name, size: file.size };
      startUpload(file, R);
      drawRegister(body, st);
    };
    $('#r-go', body).onclick = function () {
      save();
      var miss = [];
      if (!String(R.resourceTitle || '').trim()) miss.push('title'); if (!R.resourceType) miss.push('resource type'); if (!R.subjectArea) miss.push('subject area'); if (!R.gradeLevel) miss.push('grade level');
      if (!R.developers.some(function (x) { return x.first && x.last; })) miss.push('a developer'); if (!String(R.school || '').trim()) miss.push('school'); if (!R.qaBy) miss.push('who quality assured it');
      if (R.mode === 'upload' && !R.file) miss.push('the file');
      if (R.mode === 'upload' && R.up && R.up.state === 'failed') { $('#r-msg').innerHTML = errBox('The file did not upload (' + R.up.error + '). Choose the file again.'); window.scrollTo(0, 0); return; } if (R.mode === 'link' && !/^https:\/\//i.test(String(R.fileLink || '').trim())) miss.push('an https:// link to the material');
      if (miss.length) { $('#r-msg').innerHTML = errBox('Please provide ' + miss.join(', ') + '.'); window.scrollTo(0, 0); return; }
      modal({ title: 'Register and issue a CU number?', body: '<p><b>' + esc(R.resourceTitle) + '</b> will receive the next CU number, a certificate, and a public registry record right away.</p>' +
        '<p class="small muted">Quality assured by ' + esc(R.qaBy) + (R.qaReference ? ' · ' + esc(R.qaReference) : '') + '. This is recorded in the audit log.</p>',
        footer: '<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-gold" id="do">Register & issue</button>',
        onOpen: function (bg, close) {
          $('#do', bg).onclick = function () {
            var x = this, upl = R.mode === 'upload' && R.up;
            busy(x, true, upl && upl.state === 'uploading' ? 'Finishing upload…' : 'Issuing…');
            var payload = {}; Object.keys(R).forEach(function (k) { if (k !== 'file' && k !== 'mode' && k !== 'up') payload[k] = R[k]; });
            if (R.mode === 'upload') { payload.fileLink = ''; payload.resourceLink = ''; } else payload.publishFile = false;
            payload.developers = R.developers.filter(function (d) { return d.first && d.last; });
            (upl ? upl.p : Promise.resolve(null)).then(function (id) {
              if (upl) { if (!id) throw new Error('The file did not upload (' + (upl.error || 'unknown error') + '). Choose the file again.'); payload.uploadId = id; busy(x, true, 'Issuing…'); }
              return api('registerDirect', S.token, payload, null);
            }).then(function (r) {
              close(); REG = regBlank(); drawRegister(body, st);
              modal({ title: 'Registered', body: '<p class="section-label">CU number issued</p>' + codeParts(r.CU_Code, true) +
                '<p style="margin-top:16px">The certificate was created' + (payload.contactEmail ? ' and is being emailed to ' + esc(payload.contactEmail) : '') + '. The record is live in the public catalog.</p>' + (r.warning ? errBox(r.warning) : ''),
                footer: (r.CertificatePDF_URL ? '<button class="btn btn-ghost" data-open="' + esc(r.CertificatePDF_URL) + '">Certificate PDF</button>' : '') +
                  '<button class="btn btn-ghost" data-close data-go="cu" data-code="' + esc(r.CU_Code) + '">Public record</button><button class="btn btn-primary" data-close>Register another</button>' });
            }).catch(function (e) { busy(x, false); close(); $('#r-msg').innerHTML = errBox(e); window.scrollTo(0, 0); });
          };
        } });
    };
  }

  function templateModal(t, st) {
    var edit = !!t;
    modal({ title: edit ? 'Edit template' : 'Add certificate template', body: '<div id="tm"></div>' +
      '<div class="field"><label for="tname">Name <span class="req">*</span></label><input class="input" id="tname" value="' + esc(t ? t.Name : '') + '" placeholder="e.g. Division certificate 2026"></div>' +
      '<div class="field"><label for="turl">Google Slides or Google Docs link <span class="req">*</span></label><input class="input" id="turl" value="' + esc(t ? t.SourceURL : '') + '" placeholder="https://docs.google.com/presentation/d/…/edit">' +
      '<div class="hint">Share the file with ' + esc(st.ownerEmail || 'the account that deployed the app') + ' first. PowerPoint/Word files must be opened in Google Slides/Docs and saved there.</div></div>' +
      '<div class="field"><label for="tnotes">Notes</label><input class="input" id="tnotes" value="' + esc(t ? t.Notes : '') + '" placeholder="Optional, e.g. for SY 2026–2027"></div>' +
      (edit ? '' : '<label class="check"><input type="checkbox" id="tdef"><span>Make this the default template</span></label>'),
      footer: '<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="do">' + (edit ? 'Save' : 'Check & add template') + '</button>',
      onOpen: function (bg, close) {
        $('#do', bg).onclick = function () {
          var x = this; busy(x, true, 'Checking file…');
          api('saveTemplate', S.token, { TemplateID: t ? t.TemplateID : '', Name: $('#tname', bg).value, SourceURL: $('#turl', bg).value, Notes: $('#tnotes', bg).value, makeActive: $('#tdef', bg) ? $('#tdef', bg).checked : false })
            .then(function (r) { close(); render(); if (r.warnings && r.warnings.length) modal({ title: 'Template saved — please check', body: '<ul>' + r.warnings.map(function (w) { return '<li>' + esc(w) + '</li>'; }).join('') + '</ul>' }); else toast('Template saved'); })
            .catch(function (e) { busy(x, false); $('#tm', bg).innerHTML = errBox(e); });
        };
      } });
  }

  // ------------------------------------------------------------------
  // ADMIN: audit
  // ------------------------------------------------------------------
  function vAudit(main, alive) {
    main.innerHTML = '<div class="wrap"><div class="page-head"><div><h1>Audit Log</h1><p>Every status change and administrative action, newest first. The full log is in the AuditLog tab of the database spreadsheet.</p></div>' +
      '<label class="sr-only" for="qs">Filter</label><input class="input" id="qs" placeholder="Filter…" style="max-width:300px"></div><div id="body">' + skeleton('table') + '</div></div>';
    return api('getAuditLog', S.token, 500).then(function (rows) {
      if (!alive()) return;
      function draw() {
        var q = ($('#qs').value || '').toLowerCase();
        var list = rows.filter(function (r) { return !q || [r.UserName, r.Action, r.EntityID, r.Details, r.ToStatus].join(' ').toLowerCase().indexOf(q) !== -1; });
        $('#body').innerHTML = '<div class="card table-wrap"><table class="tbl stack"><thead><tr><th>When</th><th>Who</th><th>Action</th><th>Record</th><th>Details</th></tr></thead><tbody>' +
          list.map(function (r) {
            return '<tr><td data-l="When" class="small" style="white-space:nowrap">' + dt(r.Timestamp) + '</td><td data-l="Who">' + esc(r.UserName) + '<div class="muted small">' + esc(roleLabel(r.Role)) + '</div></td>' +
              '<td data-l="Action">' + esc(r.Action) + (r.ToStatus && r.FromStatus !== r.ToStatus ? '<div class="small muted">' + esc(r.FromStatus || '—') + ' → ' + esc(r.ToStatus) + '</div>' : '') + '</td>' +
              '<td data-l="Record" class="mono small">' + (r.EntityType === 'Application' ? '<a href="#" data-go="app" data-id="' + esc(r.EntityID) + '">' + esc(r.EntityID) + '</a>' : esc(r.EntityID)) + '</td>' +
              '<td data-l="Details" class="small">' + esc(r.Details) + '</td></tr>';
          }).join('') + '</tbody></table></div>';
      }
      $('#qs').oninput = draw; draw();
    });
  }

  // ------------------------------------------------------------------
  // Boot
  // ------------------------------------------------------------------
  function boot() {
    if (window.google && google.script && google.script.history && google.script.history.setChangeHandler) {
      google.script.history.setChangeHandler(function (e) {
        if (e.state && e.state.route) go(e.state.route, e.state.params || {}, { noUrl: true });
        else { var r = routeFromParams(e.location && e.location.parameter); go(r.route, r.params, { noUrl: true }); }
      });
    } else if (IS_DEMO || IS_WEB) {
      window.addEventListener('popstate', function (e) { if (e.state && e.state.route) go(e.state.route, e.state.params || {}, { noUrl: true }); });
    }
    var tok = tokenStore.get();
    var start = routeFromParams(INIT.params);
    var protectedStart = !!(STAFF_ONLY[start.route] || ADMIN_ONLY[start.route]);

    // One request brings settings, the signed-in staff member, and the first catalog page or record.
    var req = {}, catArgs = null;
    if (start.route === 'catalog') { catArgs = catalogArgs(start.params); req.catalog = { q: catArgs[0], filters: catArgs[1] }; }
    if (start.route === 'cu') req.record = start.params.code;
    var bootP = rawApi('bootstrap', [tok, req]);
    if (catArgs) primeMemo('searchCatalog', catArgs, bootP.then(function (r) { return r.catalog; }));
    if (req.record) primeMemo('getCatalogRecord', [req.record], bootP.then(function (r) { if (r.recordError) throw new Error(r.recordError); return r.record; }));

    var shown = false;
    function startUi() { S.route = start.route; S.params = start.params; setUrl(S.route, S.params, true); shown = true; render(); }
    var saved = null;
    try { saved = JSON.parse(store.get(CFG_KEY) || 'null'); } catch (e) { saved = null; }
    if (saved && saved.lists && !protectedStart) { S.cfg = saved; startUi(); } // repeat visit: draw at once from this device

    bootP.then(function (r) {
      var changed = JSON.stringify(r.config) !== JSON.stringify(S.cfg);
      S.cfg = r.config; store.set(CFG_KEY, JSON.stringify(r.config));
      if (r.user) { S.token = tok; S.user = r.user; } else if (tok) { tokenStore.set(null); }
      if (!shown) startUi();
      else if (changed || r.user) refreshChrome();
    }).catch(function (e) {
      if (shown) { toast(e.message, true); return; }
      if (e && e.setup) {
        $app.innerHTML = '<header class="topbar"><div class="topbar-inner"><div class="brand"><div class="seal">CU</div><div class="brand-text"><div class="brand-kicker">Learning Resource Management Section</div><div class="brand-name">CU Registry</div></div></div></div></header>' +
          '<div class="wrap narrow"><div class="card card-pad" style="border-top:3px solid var(--foil)"><p class="section-label">Almost there</p><h1 style="font-size:30px;margin-bottom:8px">Connect this page to Google</h1>' +
          '<p class="muted" style="margin-top:0">The registry\'s screens, data and sign-in come from your Google Apps Script backend, so nothing can show until this page knows its address.</p>' +
          '<ol class="howto"><li>In Apps Script, open <b>Deploy → Manage deployments</b> and copy the <b>Web app URL</b> (it ends in <span class="mono">/exec</span>).</li>' +
          '<li>Open this <span class="mono">index.html</span> in a text editor, find <span class="mono">PASTE YOUR APPS SCRIPT WEB APP URL</span>, and paste the URL between the quotes on the next line: <span class="mono">apiUrl: \'https://script.google.com/macros/s/…/exec\'</span></li>' +
          '<li>Save the file, upload it to GitHub, and open your GitHub Pages address.</li></ol>' +
          '<button class="btn btn-primary" onclick="location.reload()">I\'ve added it — reload</button></div></div>';
        return;
      }
      $app.innerHTML = '<div class="wrap narrow"><div class="card card-pad"><h1>Registry unavailable</h1><p>' + esc(e.message) + '</p>' +
        '<p class="muted small">If this keeps happening, check that the Apps Script deployment is set to “Who has access: Anyone” and that the address in index.html ends in /exec.</p>' +
        '<button class="btn btn-primary" onclick="location.reload()">Try again</button></div></div>';
    });
  }
  boot();
})();
</script>

</body>
</html>
